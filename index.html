<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070707">
<meta name="description" content="IIXI — pointless internet experiments. Waste time responsibly.">
<title>IIXI — No Purpose / 2026</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap');
:root{--bg:#070707;--fg:#f4f2ec;--muted:#777;--acid:#b4ff2c;--line:#252525;--panel:#0d0d0d}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}
body{overflow:hidden;background:var(--bg);color:var(--fg);font-family:"Space Grotesk",sans-serif;transition:background .6s,color .6s}

@keyframes noise{0%{transform:translate(0)}25%{transform:translate(2%,-1%)}50%{transform:translate(-1%,2%)}75%{transform:translate(1%,1%)}100%{transform:translate(-2%,-2%)}}
.scanlines{position:fixed;inset:0;pointer-events:none;z-index:45;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.012) 4px);mix-blend-mode:screen}
.cursor-glow{position:fixed;width:520px;height:520px;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(180,255,44,.11),transparent 65%);z-index:0}
header{position:fixed;left:32px;right:32px;top:27px;display:flex;justify-content:space-between;align-items:center;z-index:20}
.header-left{display:flex;align-items:center;gap:10px}.logo{background:none;border:0;color:#fff;font-size:24px;font-weight:700;letter-spacing:-2px;padding:0}.logo span{color:var(--acid)}
.back-btn{display:none;border:1px solid #252525;background:#0c0c0c;color:#777;border-radius:999px;padding:8px 12px;font:10px "DM Mono",monospace;letter-spacing:1px;transition:.2s}.back-btn.show{display:inline-flex}.back-btn:hover{color:#fff;border-color:#555;transform:translateX(-2px)}
.header-actions{display:flex;gap:8px}.tiny{border:1px solid #252525;background:#0c0c0c;color:#777;border-radius:999px;padding:8px 11px;font:10px "DM Mono",monospace;letter-spacing:1px;transition:.2s}.tiny:hover{color:#fff;border-color:#555}
main{height:100%;position:relative}.experiment{position:absolute;left:32px;top:50%;transform:rotate(-90deg) translateX(-50%);transform-origin:left top;font:11px "DM Mono",monospace;letter-spacing:3px;color:#555}
.counter{position:absolute;right:6%;top:11%;font-size:clamp(100px,18vw,260px);font-weight:700;line-height:.8;color:#111;letter-spacing:-.09em;user-select:none}
.visit{position:absolute;right:32px;bottom:27px;font:9px "DM Mono",monospace;letter-spacing:2px;color:#333}
.scene{position:absolute;left:50%;top:50%;width:min(1080px,92vw);text-align:center;transform:translate(-50%,-47%);transition:transform .5s,opacity .35s}
.kicker{font:500 11px "DM Mono",monospace;letter-spacing:4px;color:#777;margin-bottom:22px}
h1{font-size:clamp(62px,10vw,145px);line-height:.84;letter-spacing:-.075em;margin:0;font-weight:700}h1 strong{color:var(--acid)}
p{font-size:18px;color:#999;margin:25px auto 30px;max-width:760px;line-height:1.5}
.action-row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;min-height:58px}
.home-actions{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:10px;width:min(860px,92vw);margin:4px auto 0}
.home-card{border:1px solid #292929;background:rgba(13,13,13,.72);color:#eee;text-align:left;padding:18px 16px;min-height:92px;cursor:pointer;transition:.22s;position:relative;overflow:hidden}
.home-card:hover{border-color:#555;transform:translateY(-3px);box-shadow:0 18px 45px rgba(0,0,0,.25)}
.home-card strong{display:block;font:500 11px "DM Mono",monospace;letter-spacing:2px;margin-bottom:12px}.home-card span{display:block;color:#777;font-size:13px;line-height:1.4}.home-card b{position:absolute;right:13px;top:13px;color:#555;font:12px "DM Mono",monospace}
body.secret .home-card{border-color:rgba(0,0,0,.18);background:rgba(0,0,0,.04);color:#050505}body.secret .home-card span{color:#222}
.action{position:relative;border:1px solid #393939;background:#111;color:#fff;border-radius:999px;padding:16px 23px 16px 27px;cursor:pointer;font:500 12px "DM Mono",monospace;letter-spacing:2px;transition:.2s}
.action:hover:not(:disabled){border-color:var(--acid);box-shadow:0 0 35px rgba(180,255,44,.13);transform:translateY(-2px)}
.action:disabled{opacity:.45;cursor:wait}.action i{font-style:normal;font-size:16px;margin-left:22px}
.action.holding{border-color:var(--acid);box-shadow:0 0 45px rgba(180,255,44,.2);transform:scale(1.04)}
.timer{margin-top:28px;font:10px "DM Mono",monospace;letter-spacing:2px;color:#3e3e3e}
.achievement{height:17px;margin-top:12px;font:9px "DM Mono",monospace;letter-spacing:2px;color:var(--acid);opacity:0;transition:.25s}.achievement.show{opacity:1}
.edge{position:absolute;bottom:70px;font:10px "DM Mono",monospace;letter-spacing:2px;color:#444}.edge-left{left:32px}.edge-right{right:32px}
.progress{position:absolute;left:32px;right:32px;bottom:27px;height:1px;background:#1e1e1e}.progress span{display:block;height:100%;width:0;background:var(--acid);transition:width .5s}
.toast{position:fixed;left:50%;bottom:75px;transform:translate(-50%,15px);opacity:0;background:#f2f0ea;color:#080808;padding:10px 16px;border-radius:5px;font:10px "DM Mono",monospace;z-index:70;transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;z-index:60}.overlay.show{display:flex}
.overlay-box{width:min(650px,90vw);border:1px solid #303030;background:#0b0b0b;padding:34px;text-align:center}.overlay-box small{font:10px "DM Mono",monospace;letter-spacing:3px;color:#666}.overlay-box h2{font-size:42px;letter-spacing:-.05em;margin:18px 0 8px}.overlay-box p{margin:0 0 25px;font-size:15px}.overlay-box button{border:1px solid #444;background:#f2f0ea;color:#080808;padding:12px 25px;border-radius:999px;font:600 11px "DM Mono",monospace;letter-spacing:2px}
.widget{width:min(760px,94vw);margin:0 auto}.mini{font:10px "DM Mono",monospace;letter-spacing:2px;color:#555;margin-top:14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:min(720px,94vw);margin:0 auto}.choice{border:1px solid #2c2c2c;background:#0d0d0d;color:#eee;padding:18px 12px;border-radius:8px;transition:.2s}.choice:hover{border-color:var(--acid);transform:translateY(-2px)}
.reaction{width:220px;height:72px;border-radius:8px;border:1px solid #333;background:#151515;color:#777;font:500 12px "DM Mono",monospace}.reaction.ready{background:var(--acid);color:#050505;border-color:var(--acid)}
.stroop-word{font-size:44px;font-weight:700;letter-spacing:-.04em;margin-bottom:18px}.swatch{width:150px;height:48px;border-radius:7px;border:1px solid #333}
.memory-dots{display:flex;gap:12px;justify-content:center}.memory-dot{width:54px;height:54px;border-radius:50%;border:1px solid #444;background:#111}.memory-dot.on{background:var(--acid);box-shadow:0 0 35px rgba(180,255,44,.4)}
.target-area{position:relative;width:min(700px,90vw);height:220px;margin:0 auto;border:1px solid #222;background:#090909;border-radius:8px;overflow:hidden}.target{position:absolute;width:42px;height:42px;border-radius:50%;background:var(--acid);border:0}
.typebox{width:min(680px,90vw);background:#0d0d0d;border:1px solid #2b2b2b;color:#eee;padding:18px;border-radius:8px;text-align:left;outline:none}.typebox:focus{border-color:var(--acid)}
.range{width:min(620px,85vw);accent-color:var(--acid)}.number-display{font:500 28px "DM Mono",monospace;margin:10px 0}
.fact{border:1px solid #292929;background:linear-gradient(135deg,#0d0d0d,#101010);padding:22px;text-align:left;border-radius:8px}.fact .tag{font:10px "DM Mono",monospace;color:var(--acid);letter-spacing:2px}.fact h3{font-size:28px;margin:12px 0 8px}.fact p{font-size:15px;margin:0;color:#aaa}.fact button{margin-top:18px}
.quiz{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-width:620px;margin:auto}.quiz button{text-align:left}
.reveal{min-height:72px;display:flex;align-items:center;justify-content:center;border:1px dashed #333;border-radius:8px;padding:15px;color:#aaa}
.big-digit{font:700 100px/1 "Space Grotesk",sans-serif;color:var(--acid)}
.optical{height:170px;display:flex;align-items:center;justify-content:center;gap:30px}.optical .line{width:150px;height:2px;background:#eee;position:relative}.optical .line:before,.optical .line:after{content:"";position:absolute;left:50%;top:50%;width:70px;height:70px;border:1px solid #555;transform:translate(-50%,-50%);border-radius:50%}
.secret-panel{border:1px solid #3c3c3c;padding:24px;background:#0c0c0c;text-align:left}.secret-panel code{color:var(--acid)}
body.secret{background:var(--acid);color:#050505}body.secret .logo,body.secret .experiment,body.secret .edge,body.secret .timer,body.secret .visit,body.secret .tiny{color:#050505}body.secret .tiny{border-color:rgba(0,0,0,.25);background:transparent}body.secret .counter{color:rgba(0,0,0,.08)}body.secret .kicker{color:#111}body.secret h1 strong{color:#050505}body.secret p{color:#222}body.secret .progress{background:rgba(0,0,0,.2)}body.secret .progress span{background:#050505}body.secret .action{background:#050505;color:#fff;border-color:#050505}
.glitch{animation:glitch .18s steps(2) 4}@keyframes glitch{0%{transform:translate(-50%,-47%)}30%{transform:translate(calc(-50% + 12px),-47%);filter:hue-rotate(40deg)}60%{transform:translate(calc(-50% - 8px),-47%)}100%{transform:translate(-50%,-47%)}}
@media(max-width:700px){header{left:20px;right:20px;top:20px}.tiny{padding:7px 8px;font-size:8px}.experiment{left:20px}.counter{right:3%;top:15%}.visit{right:20px;bottom:20px}h1{font-size:clamp(56px,17vw,100px)}p{font-size:16px}.edge-left{left:20px}.edge-right{right:20px}.progress{left:20px;right:20px}.grid{grid-template-columns:repeat(2,1fr)}.quiz{grid-template-columns:1fr}.fact h3{font-size:23px}.home-actions{grid-template-columns:repeat(2,1fr);width:min(520px,92vw)}.home-card{min-height:82px;padding:15px 13px}}
</style>
</head>
<body>
<div class="grain"></div><div class="cursor-glow"></div><div class="scanlines"></div>
<header>
  <div class="header-left"><button class="logo" id="logo" aria-label="Reset IIXI">IIXI<span>.</span></button><button class="back-btn" id="backBtn" aria-label="Go back">← BACK</button></div>
  <div class="header-actions"><button class="tiny" id="randomBtn">RANDOM ↗</button><button class="tiny" id="shareBtn">SHARE ↗</button></div>
</header>
<main>
  <div class="experiment" id="experiment">AN INTERNET EXPERIMENT</div>
  <div class="counter" id="counter">00</div>
  <div class="visit" id="visit">LOCAL VISITOR 001</div>
  <section class="scene" id="scene">
    <div class="kicker" id="kicker">AN INTERNET EXPERIMENT</div>
    <h1 id="title">What is<br><strong>IIXI?</strong></h1>
    <p id="copy">A website with absolutely no useful purpose.</p>
    <div class="action-row" id="actionRow"><button class="action" id="action"><span id="actionText">GIVE ME SOMETHING</span><i id="actionIcon">↗</i></button></div>
    <div class="home-actions" id="homeActions">
      <button class="home-card" data-kind="random"><b>↗</b><strong>🎲 RANDOM</strong><span>Surprise me.</span></button>
      <button class="home-card" data-kind="challenge"><b>↗</b><strong>⚡ CHALLENGE</strong><span>Test me.</span></button>
      <button class="home-card" data-kind="experiment"><b>↗</b><strong>🧪 EXPERIMENT</strong><span>Show me something weird.</span></button>
      <button class="home-card" data-kind="secret"><b>↗</b><strong>🥚 SECRET</strong><span>I want to find something.</span></button>
    </div>
    <div class="timer" id="timer">TIME WASTED 00:00</div>
    <div class="achievement" id="achievement" aria-live="polite"></div>
  </section>
  <div class="edge edge-left" id="edgeLeft">NO USEFUL INFORMATION</div><div class="edge edge-right" id="edgeRight">KEEP GOING →</div>
  <div class="progress"><span id="progress"></span></div>
</main>
<div class="overlay" id="overlay" aria-hidden="true"><div class="overlay-box"><small id="overlaySmall">IIXI NOTICE</small><h2 id="overlayTitle">Are you still here?</h2><p id="overlayText">That is statistically unnecessary.</p><button id="overlayButton">CLOSE</button></div></div>
<div class="toast" id="toast"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
const $=s=>document.querySelector(s);
const title=$('#title'),copy=$('#copy'),kicker=$('#kicker'),counter=$('#counter'),experiment=$('#experiment'),action=$('#action'),actionText=$('#actionText'),actionIcon=$('#actionIcon'),progress=$('#progress'),timer=$('#timer'),edgeLeft=$('#edgeLeft'),edgeRight=$('#edgeRight'),toastEl=$('#toast'),actionRow=$('#actionRow'),achievementEl=$('#achievement'),glow=$('.cursor-glow'),overlay=$('#overlay'),overlayButton=$('#overlayButton'),backBtn=$('#backBtn'),homeActions=$('#homeActions'),logo=$('#logo');

const experiments=[
{k:'AN INTERNET EXPERIMENT',t:'What is<br><strong>IIXI?</strong>',p:'Twenty small experiments. Some test you. Some test your assumptions. Some are just weird.',type:'home',a:'GIVE ME SOMETHING',r:'real world, browser world, no useful world.'},
{k:'REACTION TEST',t:'How fast<br>are <strong>you?</strong>',p:'Wait for green. Click as soon as you see it. Do not click early.',type:'reaction'},
{k:'THE STROOP<br>EXPERIMENT',t:'Read the<br><strong>colour.</strong>',p:'Ignore the word. Click the colour of the ink.',type:'stroop'},
{k:'MEMORY TEST',t:'Watch.<br><strong>Remember.</strong>',p:'A sequence will light up. Reproduce it in the same order.',type:'memory'},
{k:'PATIENCE TEST',t:'Please<br><strong>wait.</strong>',p:'There is nothing to calculate. A button will appear when it feels appropriate.',type:'wait'},
{k:'AIM TEST',t:'Find the<br><strong>dot.</strong>',p:'Hit the green target five times. It moves after every hit.',type:'aim'},
{k:'TIME PERCEPTION',t:'Count to<br><strong>10.</strong>',p:'Press START, then press STOP when you think exactly ten seconds have passed.',type:'timing'},
{k:'ESTIMATION',t:'What is<br><strong>50?</strong>',p:'Move the slider until it looks like 50. This is harder than it sounds.',type:'estimate'},
{k:'HUMAN VS RANDOM',t:'Predict the<br><strong>coin.</strong>',p:'Call heads or tails. The browser flips a fair virtual coin.',type:'coin'},
{k:'ATTENTION',t:'Find the<br><strong>odd one.</strong>',p:'One square is subtly different. Find it before the board changes.',type:'odd'},
{k:'REAL WORLD',t:'Your phone<br>is <strong>lying.</strong>',p:'A tiny fact about everyday reality. Make a guess first.',type:'fact1'},
{k:'REAL WORLD',t:'Which came<br><strong>first?</strong>',p:'A surprisingly close piece of history. Choose before revealing it.',type:'fact2'},
{k:'OPTICAL ILLUSION',t:'Your eyes<br><strong>edit reality.</strong>',p:'Look at the centre for a few seconds, then move your eyes to the blank area.',type:'illusion'},
{k:'TYPING TEST',t:'Type it<br><strong>exactly.</strong>',p:'Copy the sentence below. Your speed is not the point. Accuracy is.',type:'typing'},
{k:'COORDINATION',t:'Keep it<br><strong>inside.</strong>',p:'Drag the dot into the target. No cheating with teleportation.',type:'drag'},
{k:'REAL WORLD',t:'Fact or<br><strong>fiction?</strong>',p:'Some everyday facts sound completely made up. Pick the true one.',type:'quiz'},
{k:'SEQUENCE',t:'What comes<br><strong>next?</strong>',p:'Spot the pattern. There is one answer that fits the rule.',type:'sequence'},
{k:'SECRET',t:'There is a<br><strong>hidden layer.</strong>',p:'Try the obvious. Then try the things a normal visitor would never do.',type:'secret'},
{k:'LUCK',t:'Choose a<br><strong>door.</strong>',p:'Three doors. One contains the rare outcome. It is not skill.',type:'doors'},
{k:'THE END',t:'Nothing<br><strong>happened.</strong>',p:'Congratulations. You successfully accomplished something.',type:'end',a:'START OVER',r:'thanks for wasting your time with IIXI.'}
];

let step=0;
let history=[];
let start=Date.now();
let timerId=null,waitTimer=null,reactionTimer=null,aimTimeout=null;
let reactionReady=false,reactionStart=0,aimHits=0,memorySeq=[],memoryInput=[],memoryLock=false,timingStart=0;
let secretUnlocked=false;
let completed=0;
let seen=1;
let actionHandler=null;
let logoClicks=0,logoTimer=null,stillSince=Date.now();

try{
 seen=Number(localStorage.getItem('iixiSeen')||0)+1;
 completed=Number(localStorage.getItem('iixiCompleted')||0);
 secretUnlocked=localStorage.getItem('iixiSecretUnlocked')==='1';
 localStorage.setItem('iixiSeen',seen);
}catch(e){}
$('#visit').textContent=`LOCAL VISITOR ${String(seen).padStart(3,'0')}`;

function toast(message){
 toastEl.textContent=message;
 toastEl.classList.add('show');
 clearTimeout(toastEl._timer);
 toastEl._timer=setTimeout(()=>toastEl.classList.remove('show'),2200);
}
function achievement(message){
 achievementEl.textContent=message;
 achievementEl.classList.add('show');
 clearTimeout(achievementEl._timer);
 achievementEl._timer=setTimeout(()=>achievementEl.classList.remove('show'),3500);
}
function save(){try{localStorage.setItem('iixiCompleted',completed);localStorage.setItem('iixiSecretUnlocked',secretUnlocked?'1':'0')}catch(e){}}
function clearTimers(){clearTimeout(waitTimer);clearTimeout(reactionTimer);clearTimeout(aimTimeout);clearInterval(timerId);timerId=null}
function setMainAction(label,handler,icon='↗'){
 action.style.display='inline-flex';
 action.disabled=false;
 action.className='action';
 actionText.textContent=label;
 actionIcon.textContent=icon;
 actionHandler=handler;
}
function removeExtraControls(){
 const extras=Array.from(actionRow.children).filter(el=>el!==action);
 extras.forEach(el=>el.remove());
}
function cleanup(){
 clearTimers();
 reactionReady=false;memoryLock=false;aimHits=0;
 removeExtraControls();
 action.style.display='inline-flex';
 action.disabled=false;
 action.className='action';
 actionText.textContent='TRY IT';
 actionIcon.textContent='↗';
 actionHandler=null;
 homeActions.style.display='none';
 backBtn.classList.remove('show');
 document.body.classList.remove('secret');
}
function button(label,handler,extra=''){
 const b=document.createElement('button');
 b.type='button';
 b.className='action '+extra;
 b.innerHTML=`<span>${label}</span><i>↗</i>`;
 b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();handler();});
 return b;
}
function add(...elements){elements.forEach(el=>actionRow.appendChild(el));}
function navigateTo(next,push=true){
 if(next<0||next>=experiments.length||next===step)return;
 if(push)history.push(step);
 step=next;
 render();
}
function goBack(){
 if(!history.length){if(step!==0){step=0;render();toast('Back to IIXI.')}return;}
 step=history.pop();
 render();
 toast('Back.');
}
function randomExperiment(){
 const choices=Array.from({length:experiments.length-2},(_,i)=>i+1);
 const current=choices.indexOf(step);
 if(current>=0)choices.splice(current,1);
 const next=choices[Math.floor(Math.random()*choices.length)];
 navigateTo(next,true);
 toast(`Experiment ${String(next).padStart(2,'0')}`);
}
function chooseCategory(kind){
 const groups={
  challenge:[1,2,3,4,5,6,7,8,9,13,14,16,18],
  experiment:[10,11,12,15,16],
  secret:[17,18]
 };
 if(kind==='random')return randomExperiment();
 const list=groups[kind]||groups.experiment;
 const next=list[Math.floor(Math.random()*list.length)];
 navigateTo(next,true);
 toast(`${kind.toUpperCase()} selected`);
}
function complete(message){
 completed++;
 save();
 const next=Math.min(step+1,experiments.length-1);
 history.push(step);
 step=next;
 render();
 if(message)toast(message);
 if(completed===5)achievement('ACHIEVEMENT: CURIOUS');
 if(completed===10)achievement('ACHIEVEMENT: STILL HERE');
 if(completed===15)achievement('ACHIEVEMENT: COMMITTED TO NOTHING');
}
function unlockSecret(message){
 secretUnlocked=true;
 save();
 document.body.classList.add('secret');
 achievement('SECRET MODE UNLOCKED');
 if(message)toast(message);
}
function render(){
 cleanup();
 const s=experiments[step];
 if(step!==0)backBtn.classList.add('show');
 kicker.textContent=s.k;
 title.innerHTML=s.t;
 copy.textContent=s.p;
 counter.textContent=String(step).padStart(2,'0');
 experiment.textContent=step===experiments.length-1?'THE END':`EXPERIMENT ${String(step).padStart(2,'0')}`;
 edgeRight.textContent=s.r||'KEEP GOING →';
 edgeLeft.textContent=secretUnlocked?'SOMETHING WAS FOUND.':seen>1?'WELCOME BACK.':'NO USEFUL INFORMATION';
 progress.style.width=(step/(experiments.length-1)*100)+'%';

 if(s.type==='home'){
  setMainAction('GIVE ME SOMETHING',randomExperiment,'↗');
  homeActions.style.display='grid';
 }else if(s.type==='reaction')setupReaction();
 else if(s.type==='stroop')setupStroop();
 else if(s.type==='memory')setupMemory();
 else if(s.type==='wait')setupWait();
 else if(s.type==='aim')setupAim();
 else if(s.type==='timing')setupTiming();
 else if(s.type==='estimate')setupEstimate();
 else if(s.type==='coin')setupCoin();
 else if(s.type==='odd')setupOdd();
 else if(s.type==='fact1')setupFact1();
 else if(s.type==='fact2')setupFact2();
 else if(s.type==='illusion')setupIllusion();
 else if(s.type==='typing')setupTyping();
 else if(s.type==='drag')setupDrag();
 else if(s.type==='quiz')setupQuiz();
 else if(s.type==='sequence')setupSequence();
 else if(s.type==='secret')setupSecret();
 else if(s.type==='doors')setupDoors();
 else if(s.type==='end'){
  document.body.classList.add('secret');
  edgeLeft.textContent=`EXPERIMENTS COMPLETED: ${completed}`;
  setMainAction('START OVER',resetAll,'↻');
 }
}
function setupReaction(){
 setMainAction('GET READY',()=>{
  if(reactionReady)return;
  action.disabled=true;
  actionText.textContent='WAIT FOR GREEN';
  reactionTimer=setTimeout(()=>{
   reactionReady=true;
   reactionStart=performance.now();
   action.disabled=false;
   action.classList.add('ready');
   actionText.textContent='CLICK NOW';
  },1200+Math.random()*2800);
 });
}
function setupStroop(){
 action.style.display='none';
 const colors=[['RED','#ff4d4d'],['BLUE','#4da3ff'],['GREEN','#b4ff2c'],['YELLOW','#ffd84d']];
 const chosen=colors[Math.floor(Math.random()*colors.length)];
 const word=colors[Math.floor(Math.random()*colors.length)];
 const w=document.createElement('div');w.className='stroop-word';w.textContent=word[0];w.style.color=chosen[1];
 const g=document.createElement('div');g.className='grid';
 colors.forEach(c=>g.appendChild(button(c[0],()=>c[0]===chosen[0]?complete('Correct. You ignored the word.'):toast('Wrong colour. The word got you.'))));
 add(w,g);
}
function setupMemory(){
 action.style.display='none';
 memorySeq=Array.from({length:4},()=>Math.floor(Math.random()*6));memoryInput=[];
 const wrap=document.createElement('div');wrap.className='memory-dots';
 for(let i=0;i<6;i++){const d=document.createElement('button');d.type='button';d.className='memory-dot';d.dataset.i=i;d.disabled=true;wrap.appendChild(d)}
 add(wrap);
 let n=0;const dots=[...wrap.children];memoryLock=true;
 function flash(){
  if(n>=memorySeq.length){memoryLock=false;dots.forEach(d=>d.disabled=false);toast('Your turn.');return;}
  const d=dots[memorySeq[n++]];d.classList.add('on');
  setTimeout(()=>{d.classList.remove('on');setTimeout(flash,180)},450);
 }
 setTimeout(flash,700);
 dots.forEach(d=>d.addEventListener('click',()=>{
  if(memoryLock)return;
  memoryInput.push(Number(d.dataset.i));
  const i=memoryInput.length-1;
  if(memoryInput[i]!==memorySeq[i]){toast('Memory corrupted. Try again.');memoryInput=[];return;}
  if(memoryInput.length===memorySeq.length)complete('Memory intact.');
 }));
}
function setupWait(){
 action.style.display='none';
 const b=button('WAIT 3',()=>{});b.disabled=true;add(b);
 let n=3;b.querySelector('span').textContent=`WAIT ${n}`;
 waitTimer=setInterval(()=>{
  n--;
  b.querySelector('span').textContent=n>0?`WAIT ${n}`:'CONTINUE';
  if(n<=0){clearInterval(waitTimer);b.disabled=false;b.querySelector('span').textContent='CONTINUE';b.onclick=null;b.addEventListener('click',()=>complete('Nothing happened. Perfect.'),{once:true});}
 },1000);
}
function setupAim(){
 action.style.display='none';
 const area=document.createElement('div');area.className='target-area';
 const t=document.createElement('button');t.type='button';t.className='target';area.appendChild(t);add(area);
 aimHits=0;
 function move(){const x=Math.random()*Math.max(0,area.clientWidth-42),y=Math.random()*Math.max(0,area.clientHeight-42);t.style.left=x+'px';t.style.top=y+'px'}
 t.addEventListener('click',()=>{aimHits++;toast(`${aimHits}/5`);if(aimHits>=5)complete('Target acquired.');else move()});
 aimTimeout=setTimeout(move,100);
}
function setupTiming(){
 setMainAction('START',()=>{
  if(!timingStart){timingStart=performance.now();actionText.textContent='STOP';return;}
  const sec=(performance.now()-timingStart)/1000;const diff=Math.abs(sec-10);timingStart=0;
  toast(`${sec.toFixed(2)} seconds — off by ${diff.toFixed(2)}.`);
  action.disabled=true;
  setTimeout(()=>complete(diff<0.35?'Unreasonably accurate.':'Time perception is weird.'),700);
 });
}
function setupEstimate(){
 action.style.display='none';
 const wrap=document.createElement('div');wrap.innerHTML='<div class="number-display" id="guessValue">50</div>';
 const r=document.createElement('input');r.className='range';r.type='range';r.min=0;r.max=100;r.value=50;
 r.addEventListener('input',()=>wrap.querySelector('#guessValue').textContent=r.value);
 add(wrap,r,button('LOCK IT',()=>{const d=Math.abs(Number(r.value)-50);toast(`Distance from 50: ${d}`);setTimeout(()=>complete(d===0?'Suspiciously precise.':'Close enough.'),700)}));
}
function setupCoin(){
 action.style.display='none';
 const g=document.createElement('div');g.className='grid';
 ['HEADS','TAILS'].forEach(c=>g.appendChild(button(c,()=>{const actual=Math.random()<.5?'HEADS':'TAILS';toast(actual===c?`It was ${actual}. You called it.`:`It was ${actual}. The universe declined.`);setTimeout(()=>complete(),800)})));
 add(g);
}
function setupOdd(){
 action.style.display='none';const g=document.createElement('div');g.className='grid';const odd=Math.floor(Math.random()*12);
 for(let i=0;i<12;i++){const b=document.createElement('button');b.type='button';b.className='choice';b.style.height='70px';b.style.background=i===odd?'#151515':'#111';b.style.borderColor=i===odd?'#333':'#2a2a2a';b.addEventListener('click',()=>i===odd?complete('Your attention works.'):toast('Not that one.'));g.appendChild(b)}add(g);
}
function setupFact1(){
 action.style.display='none';const fact=document.createElement('div');fact.className='fact';fact.innerHTML='<div class="tag">REAL WORLD / 01</div><h3>Which is true?</h3><p>One of these sounds fake.</p>';const q=document.createElement('div');q.className='quiz';
 [['A','Honey can remain edible for extremely long periods when properly stored.'],['B','Glass is naturally blue in every bottle.'],['C','The Moon makes its own light.']].forEach(([l,txt])=>{const b=button(`${l} — ${txt}`,()=>{if(l==='A'){fact.querySelector('p').textContent='Correct. Honey has a remarkably long shelf life because of its chemistry and low water activity.';complete('Real-world fact unlocked.')}else toast('Nope. Try again.')});q.appendChild(b)});add(fact,q);
}
function setupFact2(){
 action.style.display='none';const fact=document.createElement('div');fact.className='fact';fact.innerHTML='<div class="tag">REAL WORLD / 02</div><h3>Which is older?</h3><p>Choose before the reveal.</p>';const q=document.createElement('div');q.className='quiz';
 [['PYRAMIDS','The Great Pyramid of Giza'],['MOON LANDING','The first crewed Moon landing']].forEach(([l])=>q.appendChild(button(l,()=>{if(l==='PYRAMIDS'){fact.querySelector('p').textContent='Correct. The Great Pyramid was built thousands of years before the 1969 Moon landing.';complete('Time is stranger than it looks.')}else toast('Wrong. Way too recent.')})));add(fact,q);
}
function setupIllusion(){
 action.style.display='none';const box=document.createElement('div');box.className='optical';box.innerHTML='<div class="line"></div><div class="line" style="width:100px"></div>';add(box,button('I SAW IT',()=>{toast('Your visual system filled in the rest.');complete()}));
}
function setupTyping(){
 action.style.display='none';const phrase='the internet has no purpose';const input=document.createElement('input');input.className='typebox';input.placeholder='type the sentence here';const b=button('CHECK',()=>{if(input.value.trim().toLowerCase()===phrase)complete('Accurate.');else toast('Not quite. Exact words, please.')});add(input,b);setTimeout(()=>input.focus(),50);
}
function setupDrag(){
 action.style.display='none';const area=document.createElement('div');area.className='target-area';const dot=document.createElement('div');dot.style.cssText='position:absolute;width:38px;height:38px;border-radius:50%;background:#b4ff2c;left:20px;top:90px;cursor:grab';const target=document.createElement('div');target.style.cssText='position:absolute;width:100px;height:100px;border:1px dashed #b4ff2c;border-radius:50%;right:70px;top:60px';area.append(dot,target);add(area);let dragging=false;
 dot.addEventListener('pointerdown',e=>{dragging=true;dot.setPointerCapture(e.pointerId)});
 dot.addEventListener('pointermove',e=>{if(!dragging)return;const r=area.getBoundingClientRect();let x=e.clientX-r.left-19,y=e.clientY-r.top-19;x=Math.max(0,Math.min(r.width-38,x));y=Math.max(0,Math.min(r.height-38,y));dot.style.left=x+'px';dot.style.top=y+'px'});
 dot.addEventListener('pointerup',()=>{dragging=false;const a=dot.getBoundingClientRect(),b=target.getBoundingClientRect();const dx=(a.left+a.width/2)-(b.left+b.width/2),dy=(a.top+a.height/2)-(b.top+b.height/2);if(Math.hypot(dx,dy)<55)complete('Coordination successful.');else toast('Inside means inside.')});
}
function setupQuiz(){
 action.style.display='none';const fact=document.createElement('div');fact.className='fact';fact.innerHTML='<div class="tag">REAL WORLD / 03</div><h3>Fact or fiction?</h3><p>Which statement is true?</p>';const q=document.createElement('div');q.className='quiz';
 [['A','A day on Venus is longer than a Venus year.'],['B','Lightning is colder than ice.'],['C','The Sun is a planet.'],['D','Bananas are not botanically berries.']].forEach(([l,txt])=>q.appendChild(button(`${l} — ${txt}`,()=>{if(l==='A'){fact.querySelector('p').textContent='True. Venus rotates so slowly that one sidereal rotation takes longer than one trip around the Sun.';complete('Reality is weird.')}else toast('False. Keep looking.')})));add(fact,q);
}
function setupSequence(){
 action.style.display='none';const fact=document.createElement('div');fact.className='fact';fact.innerHTML='<div class="tag">PATTERN TEST</div><h3>2, 4, 8, 16, ?</h3><p>One simple rule. Pick the next number.</p>';const q=document.createElement('div');q.className='quiz';[24,30,32,34].forEach(n=>q.appendChild(button(String(n),()=>n===32?complete('Pattern found.'):toast('Not the rule.'))));add(fact,q);
}
function setupSecret(){
 action.style.display='none';const box=document.createElement('div');box.className='secret-panel';box.innerHTML='<div class="tag">SECRET PROTOCOL / REAL WORLD FILES</div><h3>Normal visitors stop here.</h3><p>Find the hidden layer first: type <code>IIXI</code>, press the logo seven times, or leave the page untouched for 30 seconds.</p>';const facts=document.createElement('div');facts.className='quiz';
 [['A','A day on Venus is longer than its year.'],['B','Sharks existed before trees.'],['C','The Eiffel Tower can become slightly taller in hot weather.'],['D','Bananas are botanically berries.']].forEach(([k,t])=>facts.appendChild(button(k+' — reveal',()=>{const p=document.createElement('p');p.textContent=t;p.style.margin='0';p.style.color='var(--acid)';box.appendChild(p);toast('Real-world file opened.')})));add(box,facts);
}
function setupDoors(){
 action.style.display='none';const g=document.createElement('div');g.className='grid';['01','02','03'].forEach(n=>g.appendChild(button(`DOOR ${n}`,()=>{const win=Math.floor(Math.random()*3)+1;if(Number(n)===win){achievement('RARE OUTCOME');toast('You found the rare outcome.')}else toast(`Door ${n} was empty. Door ${String(win).padStart(2,'0')} had it.`);setTimeout(()=>complete(),700)})));add(g);
}

// Reliable main action: one listener, swapped safely on every render.
action.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();if(typeof actionHandler==='function'&&!action.disabled)actionHandler();});
backBtn.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();goBack();});
homeActions.querySelectorAll('.home-card').forEach(card=>card.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();chooseCategory(card.dataset.kind);}));
logo.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();if(step!==0){history=[];step=0;render();toast('Back to IIXI.')}else{start=Date.now();history=[];render();toast('IIXI reset.')}});
$('#randomBtn').addEventListener('click',e=>{e.preventDefault();e.stopPropagation();randomExperiment();});
$('#shareBtn').addEventListener('click',async e=>{e.preventDefault();e.stopPropagation();const data={title:'IIXI — No Purpose',text:'I found an experiment on IIXI. Your turn.',url:location.href};try{if(navigator.share)await navigator.share(data);else if(navigator.clipboard){await navigator.clipboard.writeText(location.href);toast('Link copied.')}else toast('Copy the page URL to share it.')}catch(err){}});
overlayButton.addEventListener('click',()=>overlay.classList.remove('show'));
document.addEventListener('mousemove',e=>{glow.style.left=e.clientX+'px';glow.style.top=e.clientY+'px';stillSince=Date.now();});
document.addEventListener('keydown',e=>{
 const tag=document.activeElement?.tagName;
 if(e.key==='Escape'){if(overlay.classList.contains('show'))overlay.classList.remove('show');else if(step!==0)goBack();return;}
 if((e.key==='Enter'||e.key===' ')&&tag!=='INPUT'&&tag!=='TEXTAREA'&&tag!=='BUTTON'){
  if(experiments[step].type==='home')randomExperiment();
  else if(experiments[step].type==='end')resetAll();
 }
 if(e.key.toLowerCase()==='r'&&tag!=='INPUT'&&tag!=='TEXTAREA')randomExperiment();
 if(e.key.toLowerCase()==='x'&&tag!=='INPUT'&&tag!=='TEXTAREA')unlockSecret('Keyboard route detected.');
});
let typed='',lastType=0;
document.addEventListener('keydown',e=>{if(e.key.length===1){const now=Date.now();if(now-lastType>2000)typed='';typed+=e.key.toUpperCase();lastType=now;if(typed.endsWith('IIXI'))unlockSecret('You found the keyboard secret.')}});
logo.addEventListener('click',()=>{logoClicks++;clearTimeout(logoTimer);logoTimer=setTimeout(()=>logoClicks=0,1600);if(logoClicks>=7){unlockSecret('Seven clicks. You found it.');logoClicks=0;}});
setInterval(()=>{if(Date.now()-stillSince>30000)unlockSecret('You waited 30 seconds for nothing. Secret unlocked.');},1000);
setInterval(()=>{const sec=Math.floor((Date.now()-start)/1000),m=String(Math.floor(sec/60)).padStart(2,'0'),s=String(sec%60).padStart(2,'0');timer.textContent=`TIME WASTED ${m}:${s}`},500);

function resetAll(){history=[];step=0;start=Date.now();completed=0;save();render();toast('Your valuable time has been reset.');}
render();
});

</script>
</body>
</html>
