<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070707">
<title>IIXI — An Unnecessary Experiment</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="grain"></div>
<div class="cursor-glow"></div>

<header>
  <button class="logo" id="logo">IIXI<span>.</span></button>
  <div class="status" id="status">VISITOR 001 / <span>UNIMPORTANT</span></div>
</header>

<main>
  <div class="experiment" id="experiment">EXPERIMENT 00</div>
  <div class="counter" id="counter">00</div>

  <section class="scene" id="scene">
    <div class="kicker" id="kicker">AN INTERNET EXPERIMENT</div>
    <h1 id="title">What is<br><strong>IIXI?</strong></h1>
    <p id="copy">A website that has no useful purpose.</p>
    <button class="action" id="action"><span id="actionText">FIND OUT</span><i>↗</i></button>
    <div class="timer" id="timer">TIME WASTED 00:00</div>
  </section>

  <div class="edge edge-left" id="edgeLeft">NO USEFUL INFORMATION</div>
  <div class="edge edge-right" id="edgeRight">KEEP GOING →</div>
  <div class="progress"><span id="progress"></span></div>
</main>

<div class="overlay" id="overlay">
  <div class="overlay-box">
    <small id="overlaySmall">IIXI NOTICE</small>
    <h2 id="overlayTitle">Are you still here?</h2>
    <p id="overlayText">That is statistically unnecessary.</p>
    <button id="overlayButton">YES</button>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="script.js"></script>
</body>
</html>
