<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07080b">
  <meta name="description" content="IIXI — a completely unnecessary internet experiment.">
  <title>IIXI — Nothing</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="noise"></div>
  <div id="cursorGlow"></div>

  <header>
    <button class="logo" id="logo" aria-label="Reset IIXI">IIXI</button>
  </header>

  <main id="stage">
    <div class="status" id="status">AN INTERNET EXPERIMENT</div>
    <h1 id="title">What is IIXI?</h1>
    <p id="message">Nobody knows. Maybe you can find out.</p>

    <button class="action" id="action">
      <span id="actionText">FIND OUT</span><span class="arrow">→</span>
    </button>

    <div class="meter"><span id="meterFill"></span></div>
    <div class="experiment">EXPERIMENT <span id="count">0</span></div>
    <div class="tiny" id="tiny"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
